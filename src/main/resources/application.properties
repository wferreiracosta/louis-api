# Application
info.app.name=@project.name@
info.app.version=@project.version@
info.app.java-version=@java.version@
info.app.description=@project.description@
info.app.encoding=@project.build.sourceEncoding@
info.app.contact-name=Wesley Costa
info.app.contact-site=https://github.com/wferreiracosta
info.app.license=MIT License
info.app.license-url=https://github.com/wferreiracosta/louis-api/blob/main/LICENSE
spring.profiles.default=@activatedProperties@

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=LouisHikariPool

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql = true
spring.jpa.properties.hibernate.format_sql = true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

# Credential values must never appear in SQL bind or request-body diagnostics.
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.springframework.jdbc.core=INFO
spring.mvc.log-request-details=false

# AWS #
aws.region=us-east-1
aws.secrets-manager-name=secret-rds-postgres-louis-use1-lcl
aws.url=http://localhost:9090
aws.access-key-id=access_key_id
aws.secret-access-key-id=access_key_id
